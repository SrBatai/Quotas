name: VENTISCA

# Tests the Godot project headless and exports playable desktop builds
# (Windows + Linux) as downloadable workflow artifacts.
on:
  pull_request:
    paths:
      - "winter-survival/**"
      - ".github/workflows/ventisca.yml"
  push:
    branches: [main]
    paths:
      - "winter-survival/**"
      - ".github/workflows/ventisca.yml"
  workflow_dispatch:

concurrency:
  group: ventisca-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    name: Headless tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: winter-survival
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Parse check
        run: godot --headless --path . -s tests/parse_check.gd

      - name: Smoke test (single player, in-process server)
        run: tests/run_smoke.sh

      - name: Art contract (ASSET_SPEC v2)
        run: |
          godot --headless --path . -s tests/inspect_models.gd ++ --quiet | tee /tmp/inspect.log
          grep -q "ALL OK" /tmp/inspect.log

      - name: Net test (1 dedicated server + 4 clients)
        run: tests/net/run_net_test.sh --clients 4 --duration 60 --soak 90

  export:
    name: Desktop builds
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: winter-survival
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}-desktop-web

      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -j -q /tmp/templates.tpz \
            templates/version.txt \
            templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe \
            templates/windows_release_x86_64_console.exe \
            templates/web_nothreads_release.zip \
            -d "$dest"
          rm /tmp/templates.tpz

      - name: Export Windows and Linux
        run: |
          godot --headless --path . --import || true
          mkdir -p export/windows export/linux
          godot --headless --path . --export-release "Windows" export/windows/Ventisca.exe
          godot --headless --path . --export-release "Linux" export/linux/ventisca.x86_64
          cp README.md export/windows/LEEME.md
          cp README.md export/linux/LEEME.md
          ls -la export/windows export/linux

      - name: Check the Linux build boots headless
        run: timeout 60 ./export/linux/ventisca.x86_64 --headless --quit-after 300

      - uses: actions/upload-artifact@v4
        with:
          name: ventisca-windows
          path: winter-survival/export/windows/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: ventisca-linux
          path: winter-survival/export/linux/
          retention-days: 30
